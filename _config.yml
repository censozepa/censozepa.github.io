# Censo ZEPA — Configuración del Sitio Web (Jekyll)

# Título y Metadatos Generales
page_title                                : "Censo ZEPA — Sistema Móvil de Censos Ornitológicos"
app_name                                  : "Censo ZEPA"
app_price                                 : "Software Libre (GPLv3)"
app_description                           : "Aplicación móvil Android para censos ornitológicos en la Red Natura 2000. Base de datos SQLite 100% offline con las 658 ZEPAs oficiales de España y especies catalogadas del MITECO."
app_icon                                  : "assets/appicon.png"

# Enlaces de Descarga y Código Fuente
apk_download_link                         : "https://github.com/censozepa/censozepa.github.io/releases"
github_repo                               : "https://github.com/censozepa"
playstore_link                            : ""
fdroid_link                               : ""
presskit_download_link                    : ""

# No utilizar auto-fetch de Apple Store (es una app Android nativa)
ios_app_id                                : ""
ios_app_country                           : "es"
enable_smart_app_banner                   : false

# Información del Proyecto y Desarrollador
your_name                                 : "Proyecto Censo ZEPA"
your_link                                 : "https://github.com/censozepa"
your_city                                 : "España"
email_address                             : ""
github_username                           : "censozepa"
mastodon_link                             : ""
twitter_username                          : ""
linkedin_username                         : ""

# Lista de Características Clave de la Aplicación
features:
  - title                                 : 658 ZEPAs Oficiales de España
    description                           : Integración íntegra de la base de datos oficial del Banco de Datos de la Naturaleza (MITECO) y Red Natura 2000 consolidada a fin de 2024.
    fontawesome_icon_name                 : map-marked-alt

  - title                                 : 100% Offline en Campo
    description                           : Diseñada para operar sin conexión a Internet ni cobertura móvil. La base de datos relacional SQLite y la taxonomía van embebidas en la app.
    fontawesome_icon_name                 : signal

  - title                                 : ZEPAs Cercanas por GPS
    description                           : Detección instantánea de los espacios protegidos más próximos mediante el cálculo de distancias por círculo máximo con la fórmula de Haversine.
    fontawesome_icon_name                 : crosshairs

  - title                                 : Rigor Taxonómico SEO/BirdLife
    description                           : Nombres científicos y vernáculos oficiales en castellano, con trazabilidad cruzada y desglose de subespecies de la Directiva Aves.
    fontawesome_icon_name                 : feather-alt

  - title                                 : Conteo y Fenología en Tiempo Real
    description                           : Interfaz táctil ergonómica para el registro de censos, preservando categorías oficiales de abundancia, población y estatus de conservación.
    fontawesome_icon_name                 : clipboard-check

  - title                                 : Software Libre y Transparente
    description                           : Licenciado bajo GNU GPLv3. Pipeline ETL auditable en Python y código fuente Kotlin/Jetpack Compose abierto a la comunidad ornitológica.
    fontawesome_icon_name                 : code-branch

# Configuración Visual del Tema (Paleta Medioambiental / Forestal)
topbar_color                              : "#0d1f14"
topbar_transparency                       : 0.90
topbar_title_color                        : "#ffffff"

cover_image                               : "assets/headerimage.png"
cover_overlay_color                       : "#12261b"
cover_overlay_transparency                : 0.85

body_background_color                     : "#f8fafc"
link_color                                : "#2e7d32"

app_title_color                           : "#ffffff"
app_price_color                           : "#c8e6c9"
app_description_color                     : "#f1f5f9"

feature_title_color                       : "#1e293b"
feature_text_color                        : "#475569"

feature_icons_foreground_color            : "#2e7d32"
feature_icons_background_color            : "#e8f5e9"

social_icons_foreground_color             : "#2e7d32"
social_icons_background_color             : "#e8f5e9"

footer_text_color                         : "#64748b"

####################################################
### Configuración de Jekyll                      ###
####################################################

sass:
  style: :compressed

exclude:
  - LICENSE
  - README.md
  - CNAME
  - vendor
  - test

collections:
  pages:
    output: true
    permalink: /:path/

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
