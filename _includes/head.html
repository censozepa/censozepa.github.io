<head>
	<meta charset="utf-8">
	<meta http-equiv="x-ua-compatible" content="ie=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title class="pageTitle">{% if page.title %}{{ page.title }} — {{ site.app_name }}{% else %}{{ site.page_title }}{% endif %}</title>
	<meta name="description" content="{{ site.app_description }}">

	<!-- Favicon -->
	<link rel="shortcut icon" type="image/png" href="{{ site.app_icon | relative_url }}">

	<!-- OpenGraph / Social Sharing -->
	<meta property="og:type" content="website">
	<meta property="og:title" content="{% if page.title %}{{ page.title }} — {{ site.app_name }}{% else %}{{ site.page_title }}{% endif %}">
	<meta property="og:description" content="{{ site.app_description }}">
	<meta property="og:image" content="{{ site.app_icon | absolute_url }}">
	<meta name="twitter:card" content="summary">

	<!-- Iconos FontAwesome -->
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" crossorigin="anonymous">
	<link rel="stylesheet" href="{{ '/main.css' | relative_url }}">
</head>
